name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets --features omni-laya/serve -- -D warnings
      - name: Frontend API tests
        run: cargo test -p omni-jev --test frontend --locked
      - name: Test
        run: cargo test --workspace --locked --features omni-laya/serve
      - name: Build
        run: cargo build --workspace --release --locked --features omni-laya/serve

  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r benchmarks/requirements.txt
      - run: python benchmarks/bench.py validate benchmarks/smoke.jsonl
      - run: python -m unittest discover -s tests/benchmarks -p 'test_*.py' -v
      - name: Decider validation helpers
        run: python -m unittest discover -s tests/decider -p 'test_*.py' -v

  cuda-contract:
    # The CUDA backend contract and its checker. No CUDA toolkit and no GPU: both
    # read files as text.
    #
    # The checker and its tests arrive in #25, so on a tree without them those
    # two steps are a skip, not a failure: this job has to be green on the branch
    # that carries it before #25 lands, and it has to start running by itself
    # once #25 does, in either merge order. Failing instead would redden whichever
    # PR arrived second. The backend tests come from the repository tests/ tree,
    # which is already in main, so they run either way.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check for the checker
        id: present
        run: |
          if [ -f src/backends/cuda/check_contract.py ] && [ -d src/backends/cuda/tests ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::src/backends/cuda/check_contract.py and src/backends/cuda/tests are not in this tree; they arrive in #25. Skipping."
          fi
      - name: Contract checker tests
        if: steps.present.outputs.ready == 'true'
        run: python -m unittest discover -s src/backends/cuda/tests -t . -v
      - name: Backend tests
        # Tests live under the repository-level tests/ tree, not beside the
        # kernels they cover (CONTRIBUTING.md, "Adding a model"). Same
        # invocation as the benchmarks job: tests/cuda is not a package, so
        # discovery has to use the start directory as its own top level.
        run: python -m unittest discover -s tests/cuda -p 'test_*.py' -v
      - name: Contract check
        if: steps.present.outputs.ready == 'true'
        run: python src/backends/cuda/check_contract.py --repo-root .

  cuda-compile:
    # Tier 2 of the contract: build every declared backend, so a kernel that
    # stops compiling cannot land. No GPU and no self-hosted runner -- nvcc
    # cross-compiles for a target it is not running on, and nothing here runs
    # what it builds. Tier 3, which does need a card, stays separate.
    #
    # The container carries nvcc and cuBLASLt. Laya exports its CUDA from
    # TileLang before compiling it, so the TileLang the recipe records is
    # installed too. The CUDA line is 13.0 because that is what
    # `recipe/laya/native/README.md` records for the native build.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: nvidia/cuda:13.0.0-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-pip
          python3 -m pip install --no-cache-dir --break-system-packages tilelang==0.1.14
      - name: Compile every declared backend
        # The manifests decide what is built: a backend added anywhere under
        # src/backends/cuda/ is covered without an edit here. One backend's
        # defect is reported against that backend and does not stop the others.
        run: python3 src/backends/cuda/build_backends.py --repo-root . --out "$RUNNER_TEMP/cuda-build"
      - name: Report the architecture inside every library
        # A file of the declared name can exist and still carry the wrong targets,
        # or no device code at all: its presence proves neither. Listing the ELF
        # images is what distinguishes a library built for a target from an empty
        # metadata image.
        run: |
          missing=0
          for library in "$RUNNER_TEMP"/cuda-build/*/*.so; do
            [ -f "$library" ] || continue
            echo "== $library"
            cuobjdump --list-elf "$library" | tee "$library.elf.txt"
            if ! grep -q "sm_" "$library.elf.txt"; then
              echo "   no sm_ target inside this library" >&2
              missing=1
            fi
          done
          exit $missing
