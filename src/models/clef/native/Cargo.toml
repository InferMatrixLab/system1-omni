[package]
name = "omni-clef"
version = "0.2.0"
edition = "2024"
publish = false
description = "Rust HTTP server for Clef. Admission uses omni-runtime; the pinned Python executor stays on one thread."

[[bin]]
name = "omni-clef"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
axum = "0.8.8"
http-body-util = "0.1"
omni-runtime = { path = "../../../runtime" }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
tokio = { version = "1.49.0", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
serde_json = { version = "1.0.149", features = ["preserve_order"] }
tokio = { version = "1.49.0", features = ["macros", "net", "rt-multi-thread", "time"] }

[[test]]
name = "serve"
path = "../../../../tests/clef/serve.rs"
