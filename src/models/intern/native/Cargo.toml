[package]
name = "omni-intern-native"
version = "0.2.2"
edition = "2024"
publish = false
description = "Native text decision worker for Intern-Decision-4B"

[dependencies]
anyhow = "1.0.100"
axum = "0.8.8"
half = "2.7.1"
memmap2 = "0.9.9"
omni-qwen3-5-native = { path = "../../qwen3_5/native" }
omni-runtime = { path = "../../../runtime" }
safetensors = "0.8.0"
serde_json = { version = "1.0.149", features = ["float_roundtrip", "preserve_order"] }
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }
tokio = { version = "1.49.0", features = ["macros", "net", "rt-multi-thread"] }

[[test]]
name = "contract"
path = "../../../../tests/intern/contract.rs"

[[test]]
name = "prefill"
path = "../../../../tests/intern/prefill.rs"
