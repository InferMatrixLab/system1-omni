[package]
name = "omni-vela-native"
version = "0.1.0"
edition = "2024"
publish = false
description = "Vela 2.0 0.3B ModernBERT profile on the family core"

[dependencies]
anyhow = "1"
memmap2 = "0.9"
omni-modernbert = { path = "../../modernbert" }
safetensors = "0.6"
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "vela_profile"
path = "../../../../tests/vela/native/profile.rs"

[[test]]
name = "vela_weights"
path = "../../../../tests/vela/native/weights.rs"

[[test]]
name = "vela_rope"
path = "../../../../tests/vela/native/rope.rs"
