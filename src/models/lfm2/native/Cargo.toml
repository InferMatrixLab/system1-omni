[package]
name = "omni-lfm2-native"
version = "0.1.0"
edition = "2024"
publish = false
description = "LFM2.5-350M preparation, score interpretation and CPU artifact verification"

[dependencies]
anyhow = "1.0.100"
ryu = "1.0.23"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["arbitrary_precision", "float_roundtrip", "preserve_order", "raw_value"] }
sha2 = "0.10.9"
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }

[[test]]
name = "native_cli"
path = "../../../../tests/lfm2/native_cli.rs"
